name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  # The Orca commit whose plugin validator checks the manifest. Bump it deliberately.
  ORCA_REF: 81ec82b3651703f6ab3ba1a74b729453919e69e5

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stablyai/orca
          ref: ${{ env.ORCA_REF }}
          path: orca
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: orca/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: orca/pnpm-lock.yaml

      # The validator needs only Orca's JavaScript packages, not Electron.
      - name: Install Orca's validator
        working-directory: orca
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build:packages

      - name: Validate the manifest the way Orca loads it
        working-directory: orca
        run: pnpm validate:plugin "$GITHUB_WORKSPACE/plugin"

      - name: Tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        run: test "v$(node -p "require('./orca-plugin.json').version")" = "$GITHUB_REF_NAME"

  audit:
    # The audit and git logic, through the CLI, on the fixtures: no Orca needed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: A sound memory passes, a broken one fails
        run: |
          home="$(mktemp -d)"
          mkdir -p "$home/.claude"
          ln -s "$PWD/fixtures/projects" "$home/.claude/projects"
          HOME="$home" node src/cli.ts -demo-ok
          if HOME="$home" node src/cli.ts -demo-broken; then echo "expected the broken memory to fail"; exit 1; fi
